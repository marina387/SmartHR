{% extends 'base.html' %}
{% block title %}SmartHR — Смена пароля{% endblock %}
{% block content %}
<form method="post" class="card border-0 shadow-sm p-4 mx-auto" style="max-width:480px">
<h1 class="h4">Смена пароля</h1>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="oldPassword" class="form-label">Текущий пароль</label><input id="oldPassword" type="password" name="old_password" class="form-control mb-3" required maxlength="256" autocomplete="current-password">
<label for="newPassword" class="form-label">Новый пароль</label><input id="newPassword" type="password" name="new_password" class="form-control mb-3" required minlength="12" maxlength="256" autocomplete="new-password">
<label for="repeatPassword" class="form-label">Повторите новый пароль</label><input id="repeatPassword" type="password" name="repeat_password" class="form-control mb-3" required minlength="12" maxlength="256" autocomplete="new-password">
<p class="small text-muted">После смены пароля остальные сессии этой учётной записи будут завершены.</p>
<button class="btn btn-primary">Сохранить пароль</button></form>
{% endblock %}
